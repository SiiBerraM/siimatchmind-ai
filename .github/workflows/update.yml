name: update-space
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt huggingface_hub
      - name: Import football-data
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          cd backend
          python importer.py --source football-data --competition PL,ELC,BL1,SA,PD,FL1,DED,PPL,BSA,CL,EC,WC
      - name: Import Highlightly (Arabic leagues)
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          cd backend
          python importer.py --source highlightly --hl-league 199067,262041,170984,256935,260339 --season 2026 || echo "::warning::Highlightly import failed"
      - name: Build static
        run: |
          cd backend
          python build_static.py --standalone
      - name: Save static data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git status --short
          git add docs
          git diff --cached --quiet || (git commit -m "Update static data" && git pull --rebase --autostash && git push)
      - name: Upload
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python upload.py
