name: update-space
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt huggingface_hub
      - name: Restore saved leagues
        run: |
          cd backend
          python persist.py restore
      - name: Import football-data
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          cd backend
          python importer.py --source football-data --competition PL,ELC,BL1,SA,PD,FL1,DED,PPL,BSA,CL,EC,WC
      - name: Import Highlightly (Arabic, women's and youth leagues)
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          cd backend
          for L in 199067 262041 170984 256935 260339 38228 121626 55248 70566 119073 216938 595633 12698 758174 775194 630524 960712 598186; do
            python importer.py --source highlightly --hl-league $L --season 2026 || echo "::warning::league $L failed"
          done
      - name: Import national teams pools
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          cd backend
          python import_pools.py --active --reserve 10 || echo "::warning::pools failed"
      - name: Import Sii-Football (disability football)
        run: |
          cd backend
          python import_sii_football.py || echo "::warning::sii-football import failed"
      - name: Track predictions
        run: |
          cd backend
          python track.py || echo "::warning::tracking failed"
      - name: Build static
        run: |
          cd backend
          python build_static.py --standalone
      - name: Fetch press
        run: python backend/fetch_press.py || echo "::warning::press fetch failed"
      - name: Preserve UI and SEO files on docs/
        run: |
          python3 - << 'EOF'
          import os, re

          os.makedirs("docs", exist_ok=True)

          robots_path = "docs/robots.txt"
          robots_content = "User-agent: *\nAllow: /\n\nSitemap: https://siiberram.github.io/siimatchmind-ai/sitemap.xml\n"
          open(robots_path, "w", encoding="utf-8").write(robots_content)

          sitemap_path = "docs/sitemap.xml"
          sitemap_content = '''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://siiberram.github.io/siimatchmind-ai/</loc>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          '''
          open(sitemap_path, "w", encoding="utf-8").write(sitemap_content)

          path = "docs/index.html"
          if not os.path.isfile(path):
              print("SKIP_NO_INDEX")
              raise SystemExit(0)

          s = open(path, encoding="utf-8", errors="ignore").read()
          s = re.sub(r"<style id=\"ny-gift-fix-style\">.*?</style>", "", s, flags=re.S)
          s = re.sub(r"<div id=\"ny-center-gift-box\">.*?</div>\s*</div>", "", s, flags=re.S)
          s = re.sub(r"<style id=\"ny-footer-style\">.*?</style>", "", s, flags=re.S)
          s = re.sub(r"<footer id=\"ny-site-footer\".*?</footer>", "", s, flags=re.S)
          s = re.sub(r"<script id=\"ny-footer-lang-script\">.*?</script>", "", s, flags=re.S)
          s = re.sub(r"<title>.*?</title>", "", s, flags=re.S | re.I)
          s = re.sub(r'<meta\s+name="description"[^>]*>\s*', "", s, flags=re.I)
          s = re.sub(r'<meta\s+property="og:[^"]*"[^>]*>\s*', "", s, flags=re.I)

          gift_css = '''<style id="ny-gift-fix-style">
            #ny-center-gift-box {
              display: block;
              width: 92%;
              max-width: 440px;
              margin: 14px auto;
              padding: 14px 16px;
              background: #0f172a;
              border: 1.5px solid #facc15;
              border-radius: 14px;
              text-align: center;
              box-sizing: border-box;
            }
            #ny-center-label {
              display: block;
              width: 100%;
              color: #f8fafc;
              font-size: 14px;
              font-weight: 700;
              line-height: 1.5;
              margin-bottom: 10px;
            }
            #ny-direct-paypal-btn {
              display: inline-block;
              width: auto;
              min-width: 190px;
              padding: 10px 18px;
              background: #0070ba;
              color: #ffffff !important;
              font-size: 14px;
              font-weight: 700;
              line-height: 1.2;
              text-decoration: none;
              border-radius: 8px;
              white-space: nowrap;
            }
          </style>'''

          gift_html = '''<div id="ny-center-gift-box">
            <div id="ny-center-label">🎁 Support SiiMatchMind® • دعم المنصة</div>
            <a id="ny-direct-paypal-btn" href="https://www.paypal.com/ncp/payment/EY5BNZ6VKRBD4" target="_blank" rel="noopener noreferrer">🎁 Send Gift via PayPal</a>
          </div>'''

          footer_css = '''<style id="ny-footer-style">
            #ny-site-footer {
              width: 100%;
              max-width: 960px;
              margin: 28px auto 18px;
              padding: 16px 18px;
              background: #0f172a;
              border: 1px solid rgba(250, 204, 21, 0.45);
              border-radius: 14px;
              color: #e2e8f0;
              font-size: 13px;
              line-height: 1.6;
              text-align: center;
              box-sizing: border-box;
            }
            #ny-site-footer .ny-footer-top {
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              justify-content: center;
              gap: 10px;
              margin-bottom: 10px;
            }
            #ny-site-footer .ny-brand-badge {
              font-weight: 700;
              color: #f8fafc;
            }
            #ny-site-footer .ny-brand-link {
              color: #facc15;
              font-weight: 700;
              text-decoration: none;
            }
            #ny-site-footer .ny-brand-link:hover {
              text-decoration: underline;
            }
            #ny-site-footer .ny-brand-accent {
              color: #facc15;
              font-weight: 700;
            }
            #ny-site-footer .ny-lang-bar {
              display: inline-flex;
              align-items: center;
              gap: 6px;
              background: #1e293b;
              padding: 4px 8px;
              border-radius: 8px;
              border: 1px solid rgba(148, 163, 184, 0.25);
            }
            #ny-site-footer .ny-lang-btn {
              background: transparent;
              color: #cbd5e1;
              border: none;
              padding: 3px 8px;
              border-radius: 6px;
              font-size: 12px;
              font-weight: 700;
              cursor: pointer;
            }
            #ny-site-footer .ny-lang-btn.active {
              background: #0070ba;
              color: #ffffff;
            }
            #ny-site-footer .ny-footer-meta {
              color: #94a3b8;
              font-size: 12px;
            }
            #ny-site-footer .ny-sig {
              color: #f8fafc;
              font-weight: 700;
            }
          </style>'''

          footer_html = '''<footer id="ny-site-footer" dir="auto">
            <div class="ny-footer-top">
              <span class="ny-brand-badge">© 2026</span>
              <a class="ny-brand-link" href="https://siiberram.github.io/Sii-Football/" target="_blank" rel="noopener noreferrer">Sii-Football®</a>
              <span>•</span>
              <span class="ny-brand-accent">SiiMatchMind®</span>
              <div class="ny-lang-bar" role="group" aria-label="Language switcher">
                <button type="button" class="ny-lang-btn active" data-lang="ar">العربية</button>
                <button type="button" class="ny-lang-btn" data-lang="en">EN</button>
                <button type="button" class="ny-lang-btn" data-lang="fr">FR</button>
              </div>
            </div>
            <div class="ny-footer-meta" id="ny-footer-desc">
              منصة تحليل كرة القدم والذكاء الاصطناعي — <span class="ny-sig">Berra</span>
            </div>
          </footer>
          <script id="ny-footer-lang-script">
          (function() {
            var texts = {
              ar: "منصة تحليل كرة القدم والذكاء الاصطناعي — <span class='ny-sig'>Berra</span>",
              en: "Football Analytics &amp; AI Platform — <span class='ny-sig'>Berra</span>",
              fr: "Plateforme d'analyse football &amp; IA — <span class='ny-sig'>Berra</span>"
            };
            var footer = document.getElementById("ny-site-footer");
            var desc = document.getElementById("ny-footer-desc");
            if (!footer || !desc) return;
            var btns = footer.querySelectorAll(".ny-lang-btn");
            btns.forEach(function(btn) {
              btn.addEventListener("click", function() {
                var lang = btn.getAttribute("data-lang");
                btns.forEach(function(b) { b.classList.remove("active"); });
                btn.classList.add("active");
                if (texts[lang]) desc.innerHTML = texts[lang];
                footer.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
              });
            });
          })();
          </script>'''

          seo_head = '''<title>SiiMatchMind® — تحليل كرة القدم والذكاء الاصطناعي | Football Analytics & AI</title>
          <meta name="description" content="منصة SiiMatchMind® لتحليل مباريات كرة القدم والمنتخبات والبطولات بالذكاء الاصطناعي، متكاملة مع Sii-Football®." />
          <meta property="og:title" content="SiiMatchMind® — Football Analytics & AI" />
          <meta property="og:description" content="تحليل كرة القدم والذكاء الاصطناعي — SiiMatchMind® & Sii-Football®" />
          <meta property="og:url" content="https://siiberram.github.io/siimatchmind-ai/" />
          <meta property="og:type" content="website" />'''

          head_block = seo_head + "\n" + gift_css + "\n" + footer_css
          if "</head>" in s:
              s = re.sub(r"</head>", head_block + "\n</head>", s, count=1, flags=re.I)
          else:
              s = head_block + "\n" + s

          if "<body" in s:
              s = re.sub(r"(<body[^>]*>)", r"\1\n" + gift_html, s, count=1, flags=re.I)
          else:
              s = s + "\n" + gift_html

          if "</body>" in s:
              s = re.sub(r"</body>", footer_html + "\n</body>", s, count=1, flags=re.I)
          else:
              s = s + "\n" + footer_html

          open(path, "w", encoding="utf-8").write(s)
          print("GUARDED_UI_AND_SEO")
          EOF

- name: Save static data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git status --short
          git add docs
          if [ -d backend/pooldata ]; then git add backend/pooldata; fi
          if [ -d backend/leaguedata ]; then git add backend/leaguedata; fi
          git diff --cached --quiet || (git commit -m "Update static data" && git pull --rebase --autostash && git push)
      - name: Upload
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python upload.py
