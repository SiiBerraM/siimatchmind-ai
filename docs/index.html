<script id="ny-footer-lang-script">
(function() {
  var texts = {
    ar: "منصة تحليل كرة القدم والذكاء الاصطناعي — <span class='ny-sig'>Berra</span>",
    en: "Football Analytics &amp; AI Platform — <span class='ny-sig'>Berra</span>",
    fr: "Plateforme d'analyse football &amp; IA — <span class='ny-sig'>Berra</span>"
  };
  var footer = document.getElementById("ny-site-footer");
  var desc = document.getElementById("ny-footer-desc");
  if (!footer || !desc) return;
  var btns = footer.querySelectorAll(".ny-lang-btn");
  btns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      var lang = btn.getAttribute("data-lang");
      btns.forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      if (texts[lang]) desc.innerHTML = texts[lang];
      footer.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    });
  });
})();
</script>
