  <style>:root{
  --night:#071a33; --deep:#0b2a4f; --panel:#0f3560; --line:#1d4a7c;
  --green:#1ed48a; --green-dim:#12a669; --white:#f5f8fc; --mute:#9db3cf;
  --amber:#f2b94b; --red:#ff6b6b;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:var(--night);color:var(--white);line-height:1.7;font-size:15px;
  padding:env(safe-area-inset-top,0px) 0 calc(72px + env(safe-area-inset-bottom,0px));
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--green)}
.badge{font-size:11px;white-space:nowrap;padding:1px 8px;border:1px solid var(--amber);color:var(--amber);border-radius:99px}
.note{margin:0 16px 6px;padding:6px 12px;font-size:12.5px;color:var(--mute);border-inline-start:3px solid var(--amber);background:rgba(242,185,75,.07)}

main{padding:8px 16px 24px;max-width:640px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:10px 0 12px}
h2{font-size:16px;font-weight:600;margin:22px 0 8px;color:var(--white)}
.empty,.err{color:var(--mute);padding:28px 8px;text-align:center}
.err{color:var(--red)}
.muted{color:var(--mute);font-size:13px}

.bar{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--deep);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11.5px;color:var(--mute)}
.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar a.on{color:var(--green)}

.seg{display:flex;background:var(--deep);border-radius:99px;padding:3px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:99px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--green);color:var(--night);font-weight:600}

.match{display:block;background:var(--deep);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.match .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:6px}
.match .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.match .tn{font-weight:500}
.match .tn:last-child{text-align:end}
.match .vs{min-width:58px;text-align:center;font-weight:700;font-size:18px;color:var(--green)}
.match .vs.pending{font-size:13px;font-weight:500;color:var(--mute)}

.pick{display:grid;gap:10px;margin:6px 0 14px}
.pick label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
select,input[type=search]{width:100%;padding:11px 12px;background:var(--deep);border:1px solid var(--line);border-radius:var(--r-sm)}
.btn{display:block;width:100%;border:0;background:var(--green);color:var(--night);font-weight:600;padding:12px;border-radius:var(--r-md);cursor:pointer;text-align:center}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--white);font-weight:500}

.hero{background:linear-gradient(180deg,var(--deep),var(--night));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 14px}
.hero .names{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px;gap:8px}
.hero .names small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.hero .names>div:last-child{text-align:end}
.strip{position:relative;display:flex;height:44px;border-radius:10px;overflow:hidden;margin:14px 0 6px;}
.strip div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;min-width:0;transition:flex-basis .6s ease}
.strip .h{background:var(--green);color:var(--night)}
.strip .d{background:#d5e0ee;color:var(--night)}
.strip .a{background:#3b7bd1;color:var(--white)}
.strip::after{content:"";position:absolute;inset-block:0;inset-inline-start:50%;width:1px;background:rgba(7,26,51,.35)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{border-top:1px solid var(--line);padding-top:8px}
.kpi b{display:block;font-size:22px;font-weight:600;text-align:start}
.kpi span{font-size:12px;color:var(--mute)}

.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.chip.c0{background:rgba(255,107,107,.15);color:var(--red)}
.chip.c1{background:rgba(242,185,75,.15);color:var(--amber)}
.chip.c2{background:rgba(30,212,138,.15);color:var(--green)}
ul.plain{list-style:none;padding:0}
ul.plain li{padding:7px 0;border-bottom:1px solid rgba(29,74,124,.6);font-size:14px}
ul.plain li:last-child{border:0}

table.mx{border-collapse:separate;border-spacing:2px;width:100%;direction:ltr;font-size:12px;text-align:center}
table.mx th{color:var(--mute);font-weight:400}
table.mx td{border-radius:5px;padding:7px 0;color:var(--white)}
table.mx td.best{outline:2px solid var(--white)}
.cap{font-size:12px;color:var(--mute);margin-top:4px}

.form{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 2px}
.form i{font-style:normal;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--night)}
.form .W{background:var(--green)} .form .D{background:#d5e0ee} .form .L{background:var(--red)}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{font-weight:500;color:var(--mute);text-align:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.cmp td{text-align:center;padding:7px 2px;border-bottom:1px solid rgba(29,74,124,.5)}
.cmp td:first-child,.cmp th:first-child{text-align:start;color:var(--mute)}
.res{display:grid;grid-template-columns:70px 1fr auto;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px solid rgba(29,74,124,.5)}
.res b{white-space:nowrap}
.disc{margin-top:18px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.tl{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.row2{display:flex;gap:8px}.row2>*{flex:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tools{display:flex;align-items:center;gap:8px}
.lang{width:auto;padding:4px 8px;font-size:13px;background:var(--deep);border:1px solid var(--line);border-radius:99px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:11px 12px;background:var(--deep);border:1px solid var(--line);border-radius:var(--r-sm)}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(29,74,124,.6)}
.stat b{font-weight:600}
.top{flex-wrap:wrap}
.tools{min-width:0;max-width:100%;flex-wrap:wrap}
.lang{max-width:112px;text-overflow:ellipsis}

#leagueSel{max-width:210px}

#leagueSel{max-width:210px}
/* ---- شعارات ---- */
.crest{width:28px;height:28px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.07);flex:none;display:inline-grid;place-items:center;vertical-align:middle}
.crest.ph{background:var(--panel);color:var(--white);font-weight:700;font-size:11px;letter-spacing:-.5px}
.tn{display:flex;align-items:center;gap:8px;min-width:0}
.tn span{overflow:hidden;text-overflow:ellipsis}
.match .tn:last-child{justify-content:flex-end}
.tl .nm{display:flex;align-items:center;gap:10px}
.res .crest{width:20px;height:20px;margin-inline-end:6px}
.hero .names{align-items:flex-start}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center;min-width:0}
.side b{font-size:15px;line-height:1.3}
.side small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.team-head{display:flex;align-items:center;gap:12px;margin:10px 0 6px;flex-wrap:wrap}
.team-head h1{margin:0;flex:1;min-width:120px}
.pill{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:99px;font-size:12.5px;background:rgba(30,212,138,.14);color:var(--green)}
.score-big{font-size:26px;font-weight:700;text-align:center;margin-top:6px}
/* ---- ترتيب ---- */
.tblw{overflow-x:auto;margin:0 -4px}
table.std{width:100%;border-collapse:collapse;font-size:12.5px;min-width:300px}
table.std th{color:var(--mute);font-weight:500;padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
table.std td{padding:7px 3px;text-align:center;border-bottom:1px solid rgba(29,74,124,.35)}
table.std td.pos{width:24px;color:var(--mute)}
table.std th:nth-child(2),table.std td.tm{text-align:start;width:100%}
table.std tr[data-id]{cursor:pointer}
.tmc{display:flex;align-items:center;gap:8px;min-width:0}
.tmc b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;margin-top:3px}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dots .W{background:var(--green)} .dots .D{background:#9db3cf} .dots .L{background:var(--red)}
table.std td.pts{font-weight:700}
/* ---- أزرار وأدوات ---- */
.icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--deep);color:var(--white);font-size:16px;cursor:pointer;line-height:1;padding:0}
.star{background:none;border:1px solid var(--line);color:var(--white);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:13px}
.row3{display:flex;gap:8px;flex-wrap:wrap}.row3>*{flex:1 1 110px}
.sk{height:84px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--deep),var(--panel),var(--deep));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.strip .a{color:#fff}.form .D{color:#0b1f3a}.form .W,.form .L{color:#071a33}
/* ---- المظهر الفاتح ---- */
:root[data-theme="light"]{--night:#f2f6fb;--deep:#ffffff;--panel:#e6edf7;--line:#cfdbea;--white:#0b1f3a;--mute:#566c85;--green:#0e9f63;--green-dim:#0b8453;--amber:#b7791f;--red:#d64545}
:root[data-theme="light"] .strip .h{color:#fff}
:root[data-theme="light"] .btn{color:#fff}
:root[data-theme="light"] .seg button.on{color:#fff}
:root[data-theme="light"] .badge{color:var(--amber);border-color:var(--amber)}
:root[data-theme="light"] .note{background:rgba(183,121,31,.08)}
:root[data-theme="light"] .hero{background:linear-gradient(180deg,#fff,var(--night))}
.star.on{background:rgba(30,212,138,.16);border-color:var(--green);color:var(--green)}

.more{display:block;width:100%;margin:12px 0;padding:12px;border-radius:99px;border:1px solid var(--line);background:var(--deep);color:var(--white);font-weight:600;cursor:pointer}
.about-img{display:block;width:100%;max-width:420px;height:auto;margin:14px auto 18px;border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.45)}


/* ===== قوائم مخصصة ===== */
.ddnative{display:none!important}
.dd{position:relative}
.dd[hidden]{display:none}
.ddbtn{display:flex;align-items:center;gap:6px;max-width:140px;padding:5px 12px;font-size:13px;font-family:inherit;color:var(--white);background:var(--deep);border:1px solid var(--line);border-radius:99px;cursor:pointer;transition:border-color .15s}
.ddbtn:hover,.ddbtn.open{border-color:var(--green)}
.ddtx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddar{font-size:10px;color:var(--mute);transition:transform .2s}
.ddbtn.open .ddar{transform:rotate(180deg)}
.ddpanel{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:999;min-width:240px;max-width:86vw;max-height:60vh;overflow-y:auto;padding:6px;background:var(--deep);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.ddpanel[hidden]{display:none}
.ddgrp{padding:10px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--green);text-transform:uppercase}
.ddgrp:not(:first-child){margin-top:6px;border-top:1px solid var(--line)}
.dditem{display:block;width:100%;text-align:start;padding:9px 10px;font-size:14px;font-family:inherit;color:var(--white);background:none;border:0;border-radius:9px;cursor:pointer}
.dditem:hover{background:var(--panel)}
.dditem.on{background:var(--panel);color:var(--green);font-weight:600}

.ddpanel{background:#0d1b2e!important;opacity:1!important;backdrop-filter:none!important;border:1px solid #24405f!important;z-index:99999!important;box-shadow:0 14px 40px rgba(0,0,0,.7)!important}
.dditem{color:#e8f0fa!important;background:transparent!important}
.dditem:hover,.dditem.on{background:#17304d!important}
.dditem.on{color:#3ddc97!important}
.ddgrp{background:#0d1b2e!important;color:#3ddc97!important}
.ddbtn{background:#0d1b2e!important;color:#e8f0fa!important}
:root[data-theme="light"] .ddpanel,:root[data-theme="light"] .ddgrp,:root[data-theme="light"] .ddbtn{background:#ffffff!important;border-color:#cfdbea!important}
:root[data-theme="light"] .dditem{color:#0b1f3a!important}
:root[data-theme="light"] .dditem:hover,:root[data-theme="light"] .dditem.on{background:#e6edf7!important}
:root[data-theme="light"] .dditem.on{color:#0e9f63!important}
:root[data-theme="light"] .ddbtn{color:#0b1f3a!important}

.ddpanel{position:fixed!important;left:12px!important;right:12px!important;inset-inline-end:auto!important;min-width:0!important;max-width:none!important;z-index:2147483000!important;background:#0d1b2e!important;opacity:1!important}
:root[data-theme="light"] .ddpanel{background:#ffffff!important}

html.ddlock,html.ddlock body{overflow:hidden!important;height:100%!important;touch-action:none}
.ddpanel{overscroll-behavior:contain!important;touch-action:pan-y!important;-webkit-overflow-scrolling:touch}


/* تحسين حدة وجودة عرض شعارات الفرق والصور */
img.crest, img[class*="crest"], img[class*="logo"], img[class*="avatar"] {
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  object-fit: contain;
  filter: contrast(1.04) saturate(1.06);
  transition: transform 0.2s ease, filter 0.2s ease;
}
img.crest:hover, img[class*="logo"]:hover {
  transform: scale(1.05);
  filter: contrast(1.08) saturate(1.12);
}

/* SMM_PITCH_BALL_AND_NAMES_FIX */
.smm-pitch-wrap{
  margin:10px auto 12px;
  padding:8px;
  border-radius:14px;
  background:linear-gradient(180deg,#0f3d26,#0b2a1b);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.smm-pitch{
  position:relative;
  width:100%;
  height:92px;
  border-radius:10px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 10%,rgba(0,0,0,.06) 10% 20%),
    #145332;
  border:2px solid rgba(255,255,255,.65);
  overflow:hidden;
  touch-action:none;
  user-select:none;
}
.smm-pitch::before{
  content:"";
  position:absolute;
  top:0;bottom:0;left:50%;
  width:2px;
  background:rgba(255,255,255,.55);
  transform:translateX(-50%);
}
.smm-pitch::after{
  content:"";
  position:absolute;
  top:50%;left:50%;
  width:28px;height:28px;
  border:2px solid rgba(255,255,255,.55);
  border-radius:50%;
  transform:translate(-50%,-50%);
}
.smm-goal-l,.smm-goal-r{
  position:absolute;
  top:50%;
  width:10px;height:34px;
  border:2px solid rgba(255,255,255,.85);
  transform:translateY(-50%);
  background:rgba(255,255,255,.12);
}
.smm-goal-l{left:0;border-left:none;border-radius:0 4px 4px 0;}
.smm-goal-r{right:0;border-right:none;border-radius:4px 0 0 4px;}
.smm-ball{
  position:absolute;
  width:16px;height:16px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff 0%,#e5e7eb 55%,#111827 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.55);
  transform:translate(-50%,-50%);
  cursor:grab;
  z-index:3;
}
.smm-ball:active{cursor:grabbing;}
.tm b, .td-m b, .team-name{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-weight:700;
  letter-spacing:0;
}

  function crest(name, logo, size) {

  // ---------- البيانات: خادم إن وُجد وإلا الملف الثابت ----------

  const get = p => call("GET", p);

      const k = h + "|" + a;
      if (ST.analyses[k]) return ST.analyses[k];
      if (h === a) throw { code: "same_team" };
      const th = (ST.teams || []).find(x => x.id === h), ta = (ST.teams || []).find(x => x.id === a);
      if (!th || !ta) throw { code: "not_found" };
      if (th.league !== ta.league) throw { code: "different_leagues" };
      window.SMM_PACKS = window.SMM_PACKS || {};
      if (!window.SMM_PACKS[th.league]) window.SMM_PACKS[th.league] = await jget("data/analyses/" + th.league + ".json");
      const r = window.SMM_PACKS[th.league][k];
      if (!r) throw { code: "not_found" };
      return r;
    }
  };

  // ---------- ترجمة أسماء الفرق (القاموس: locales/teams.json؛ الاسم غير المعروف يبقى كما هو) ----------
  let TNAMES = {};
  const TSUF = /^(.+?) (Women|U17|U20|U21|U23)$/, TKEYS = new Set(["name", "home_name", "away_name", "opponent_name", "team", "a", "b"]);
  function tn(name) {
    if (lang === "en" || typeof name !== "string") return name;
    const e = TNAMES[name];
    if (e) return e[lang] || name;
    const m = TSUF.exec(name), be = m && TNAMES[m[1]];
    if (!be) return name;
    const b = be[lang] || m[1], k = m[2], w = k === "Women", n = k.slice(1);
    if (lang === "ar") return w ? b + " (سيدات)" : b + " تحت " + n;
    if (lang === "fr") return b + (w ? " Féminin" : " " + k);
    if (lang === "es") return b + (w ? " Femenino" : " Sub-" + n);
    return b + (w ? " Kadın" : " " + k);
  }
  function trDeep(o) {
    if (lang === "en" || !o || typeof o !== "object") return o;
    if (Array.isArray(o)) return o.map(trDeep);
    const r = {};
    for (const k in o) {
      const v = o[k];
      if (typeof v === "string" && TKEYS.has(k)) { r[k] = tn(v); if (k === "name" && r[k] !== v) r._en = v; }
      else r[k] = trDeep(v);
    }
    return r;
  }
  ["teams", "matches", "team", "standings", "analyze"].forEach(k => { const f = api[k]; api[k] = async (...a) => trDeep(await f(...a)); });

  // ---------- المفضلة والسجل والفرق المتابَعة: على الخادم إن سُجّل الدخول وإلا على الجهاز ----------
  const store = {
    read(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } },
    write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  };
  const logged = () => mode === "api" && !!USER;
  const favs = {
    async list() { return logged() ? get("/api/favorites") : store.read("smm.fav"); },
    async toggle(h, a) {
      const cur = await favs.list();
      const has = cur.some(x => x.home === h && x.away === a);
      if (logged()) return has ? call("DELETE", `/api/favorites?home=${h}&away=${a}`) : call("POST", "/api/favorites", { home: h, away: a });
      store.write("smm.fav", has ? cur.filter(x => !(x.home === h && x.away === a)) : [{ home: h, away: a }].concat(cur));
    }
  };
  const follows = {
    async list() { return logged() ? get("/api/fav-teams") : store.read("smm.follow"); },
    async toggle(id) {
      const cur = await follows.list(), has = cur.includes(id);
      if (logged()) return has ? call("DELETE", "/api/fav-teams?team=" + encodeURIComponent(id)) : call("POST", "/api/fav-teams", { team: id });
      store.write("smm.follow", has ? cur.filter(x => x !== id) : [id].concat(cur));
    }
  };
  const hist = {
    async list() { return logged() ? get("/api/history") : store.read("smm.hist"); },
    push(r) {
      if (logged()) return;           // الخادم يسجّل السجل تلقائيًا للمستخدم المسجَّل
      const p = r.prediction.percent;
      const h = store.read("smm.hist").filter(x => !(x.home === r.home.id && x.away === r.away.id));
      h.unshift({ home: r.home.id, away: r.away.id, t: new Date().toISOString().slice(0, 10), p: [p.home, p.draw, p.away] });
      store.write("smm.hist", h.slice(0, 30));
    },
    clear() { store.write("smm.hist", []); }
  };
  const tinfo = id => TEAMS.find(x => x.id === id) || { name: id, logo: null };
  const tname = id => tinfo(id).name;
  const teamsOf = () => LEAGUE ? TEAMS.filter(x => x.league === LEAGUE) : TEAMS;

  // ---------- البطولات: أسماء مترجمة ومرتبة أبجديًا ----------
  const lname = l => DICT["league." + l.code] || EN["league." + l.code] || l.name;
  function fillLeagueSel() {
    const ls = document.getElementById("leagueSel");
    if (!ls) return;
    LEAGUES.sort((a, b) => lname(a).localeCompare(lname(b), lang));
    const SETS = { wom: new Set(["hl38228","hl121626","hl55248","hl70566","hl119073","hl216938","hl595633"]), yth: new Set(["hl12698","hl758174","hl775194","hl630524","hl960712","hl598186"]), nm: new Set(["hlnatM"]), ny: new Set(["hlnatU23","hlnatU20","hlnatU17"]), nw: new Set(["hlnatW"]), pa: new Set(["hlpara"]) };
    const GLS = {
      ar: ["دوريات الرجال", "دوريات السيدات", "دوريات الشباب", "منتخبات الرجال", "منتخبات الشباب", "منتخبات السيدات", "كرة القدم للمعاقين"],
      en: ["Men's leagues", "Women's leagues", "Youth leagues", "National teams (men)", "National youth teams", "National teams (women)", "Para football (disability)"],
      fr: ["Championnats masculins", "Championnats féminins", "Championnats de jeunes", "Équipes nationales (hommes)", "Sélections de jeunes", "Équipes nationales (femmes)", "Football handisport"],
      es: ["Ligas masculinas", "Ligas femeninas", "Ligas juveniles", "Selecciones (hombres)", "Selecciones juveniles", "Selecciones (mujeres)", "Fútbol adaptado"],
      tr: ["Erkek ligleri", "Kadın ligleri", "Gençlik ligleri", "Milli takımlar (erkek)", "Gençlik milli takımları", "Milli takımlar (kadın)", "Engelli futbolu"]
    };
    const GL = GLS[lang] || GLS.en;
    const grp = l => SETS.wom.has(l.code) ? 1 : SETS.yth.has(l.code) ? 2 : SETS.nm.has(l.code) ? 3 : SETS.ny.has(l.code) ? 4 : SETS.nw.has(l.code) ? 5 : SETS.pa.has(l.code) || String(l.code).startsWith("SF-") ? 6 : 0;
    const opt = l => `<option value="${esc(l.code)}">${esc(lname(l))}</option>`;
    ls.innerHTML = GL.map((label, i) => { const g = LEAGUES.filter(l => grp(l) === i); return g.length ? `<optgroup label="${label}">${g.map(opt).join("")}</optgroup>` : ""; }).join("");
    ls.value = LEAGUE || ""; ls.hidden = LEAGUES.length < 2;
    ls.setAttribute("aria-label", t("league.label"));
  }

  async function setLang(code) {
    if (!LANGS.some(l => l.code === code)) code = "ar";

  // ---------- مكوّنات العرض ----------
  function paintBanner() {

  function matchCard(m) {
    const played = m.status === "played";
    const mid = played ? `${m.hg} - ${m.ag}` : (m.status === "today" ? (m.time || t("match.today")) : t("match.vs"));

  const formRow = list => `<div class="form">${list.map(r => `<i class="${r.result}" title="${esc(tname(r.opponent))} ${r.gf}-${r.ga}">${t("res." + r.result)}</i>`).join("")}</div>`;
  const resultsList = list => list.map(r => `<div class="res"><span class="muted">${fmtDate(r.date)}</span><span>${r.venue === "home" ? t("res.home_vs") : t("res.away_at")} ${crest(r.opponent_name || tname(r.opponent), r.opponent_logo || tinfo(r.opponent).logo, 20)}${esc(r.opponent_name || tname(r.opponent))}</span><b>${r.gf} - ${r.ga}</b></div>`).join("");
  const cell = v => v === null || v === undefined ? "—" : v;
  const list = items => `<ul class="plain">${items.map(x => `<li>${x}</li>`).join("")}</ul>`;
  const reasonText = (prefix, r) => t(prefix + r.k, r);

  // ---------- الصفحات ----------
  async function myTeamsBlock() {
    const ids = (await follows.list()).slice(0, 8);

    return uniq.length ? `<h2>${t("follow.my_matches")}</h2>${uniq.slice(0, 5).map(matchCard).join("")}<h2>${t("home.title")}</h2>` : "";

  const MORE = { ar: "عرض المزيد", en: "Show more", fr: "Voir plus", es: "Ver más", tr: "Daha fazla" };
  const moreLbl = () => { let l = "ar"; try { l = localStorage.getItem("smm.lang") || document.documentElement.lang || "ar"; } catch (e) { } return MORE[l] || MORE.ar; };
  async function pageHome(kind) {

  function matrixTable(r) {
    const m = r.prediction.score_matrix, best = r.prediction.most_likely_score;
    let max = 0; m.forEach(row => row.forEach(v => { if (v > max) max = v; }));
    let h = `<table class="mx" aria-label="${t("an.matrix")}"><tr><th></th>${[0, 1, 2, 3, 4, 5].map(j => `<th>${j}</th>`).join("")}</tr>`;
    m.forEach((row, i) => {
      h += `<tr><th>${i}</th>` + row.map((v, j) => `<td class="${i === best.home && j === best.away ? "best" : ""}" style="background:rgba(30,212,138,${(0.08 + 0.8 * v / max).toFixed(2)})">${(v * 100).toFixed(0)}</td>`).join("") + "</tr>";
    });
    return h + `</table><p class="cap">${t("an.matrix_cap", { home: esc(r.home.name), away: esc(r.away.name) })}</p>`;

  async function shareAnalysis(r) {

  async function pageAnalysis(h, a, mid) {

      <ul class="muted">

        <p class="empty">${t("q.unavailable")}</p>

        ${breakdownHtml}

  const routes = [
    [/^#\/analyze\/([\w-]+)\/([\w-]+)(?:\/([\w-]+))?$/, "analyze", m => pageAnalysis(m[1], m[2], m[3])],
    [/^#\/analyze$/, "analyze", () => pageAnalyzeForm()],
    [/^#\/team\/([\w-]+)$/, "teams", m => pageTeam(m[1])],
    [/^#\/teams$/, "teams", () => pageTeams()],
    [/^#\/standings$/, "standings", () => pageStandings()],

    [/^#\/news$/, "saved", () => (window.smmNews || (() => {}))(view, api)],
    [/^#\/watch$/, "saved", () => (window.smmWatch || (() => {}))(view, api)],
    [/^#\/today$/, "home", () => (window.smmToday || (() => {}))(view)],
    [/^#\/about$/, "saved", () => pageAbout()],
    [/^#?\/?$/, "home", () => pageHome()]
  ];

  async function route() {
    const hash = location.hash || "#/";
    for (const [re, tab, fn] of routes) {
      const m = hash.match(re);
      if (m) {
        document.querySelectorAll(".bar a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
        view.innerHTML = skel();
        try { await fn(m); } catch (e) { view.innerHTML = `<p class="err">${esc(errText(e))}</p>`; }
        window.scrollTo(0, 0);
        return;
      }
    }
    location.hash = "#/";
  }

  function pickLang() {
    let saved = null; try { saved = localStorage.getItem("smm.lang"); } catch (e) { }
    if (saved && LANGS.some(l => l.code === saved)) return saved;
    const nav = (navigator.language || "ar").slice(0, 2).toLowerCase();
    return LANGS.some(l => l.code === nav) ? nav : "ar";
  }

  async function init() {
    try {
      initTheme();
      LANGS = window.SMM_LANGS || await jget("locales/languages.json");
      EN = window.SMM_LOCALES ? window.SMM_LOCALES.en : await jget("locales/en.json");
      const sel = document.getElementById("langSel");
      sel.innerHTML = LANGS.map(l => `<option value="${l.code}">${esc(l.name)}</option>`).join("");
      lang = pickLang(); sel.value = lang;
      await setLang(lang);
      sel.onchange = async () => { await setLang(sel.value); TEAMS = await api.teams(); route(); };
      await detect();
      try { TNAMES = window.SMM_TEAMS || await jget("locales/teams.json"); } catch (e) { }
      TEAMS = await api.teams();
      META = await api.meta();
      LEAGUES = await api.leagues();
      let savedL = null; try { savedL = localStorage.getItem("smm.league"); } catch (e) { }
      LEAGUE = LEAGUES.some(l => l.code === savedL) ? savedL : null;
      fillLeagueSel();
      if (!LEAGUE && LEAGUES[0]) LEAGUE = LEAGUES[0].code;       // أول بطولة بعد الترتيب الأبجدي
      const ls = document.getElementById("leagueSel"); ls.value = LEAGUE || "";
      ls.onchange = () => { LEAGUE = ls.value; try { localStorage.setItem("smm.league", LEAGUE); } catch (e) { } paintBanner(); if (location.hash && location.hash !== "#/") location.hash = "#/"; else route(); };
      if (mode === "api" && TOKEN) {
        try { USER = (await get("/api/me")).user; } catch (e) { TOKEN = null; try { localStorage.removeItem("smm.token"); } catch (x) { } }
      }
      paintBanner();
      window.addEventListener("hashchange", route);
      await route();
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
    } catch (e) {
      view.innerHTML = `<p class="err">${esc(DICT["err.load"] || "تعذّر تحميل البيانات / Could not load data")}<br><small>${esc(e && (e.message || e.code) || "")}</small></p>`;
    }
  }
  init();
})();


/* ===== قوائم مخصصة (بطولات + لغة) ===== */
(function () {
  function enhance(id) {
    var sel = document.getElementById(id);
    if (!sel || sel.dataset.dd) return;
    sel.dataset.dd = "1";
    var wrap = document.createElement("div"); wrap.className = "dd";
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "ddbtn";
    var panel = document.createElement("div"); panel.className = "ddpanel"; panel.hidden = true;
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(btn); document.body.appendChild(panel); wrap.appendChild(sel);
    sel.classList.add("ddnative");
    function label() {
      var o = sel.options[sel.selectedIndex], t = o ? o.textContent : "";
      if (btn.dataset.t !== t) {
        btn.dataset.t = t;
        btn.innerHTML = '<span class="ddtx"></span><span class="ddar">▾</span>';
        btn.firstChild.textContent = t;
      }
      wrap.hidden = sel.hidden;
    }
    function close() { panel.hidden = true; btn.classList.remove("open"); document.documentElement.classList.remove("ddlock"); }
    function build() {
      panel.innerHTML = "";
      var cur = sel.value;
      function item(o) {
        var b = document.createElement("button"); b.type = "button";
        b.className = "dditem" + (o.value === cur ? " on" : "");
        b.textContent = o.textContent;
        b.onclick = function () { sel.value = o.value; sel.dispatchEvent(new Event("change")); close(); label(); };
        return b;
      }
      Array.prototype.forEach.call(sel.children, function (c) {
        if (c.tagName === "OPTGROUP") {
          var h = document.createElement("div"); h.className = "ddgrp"; h.textContent = c.label;
          panel.appendChild(h);
          Array.prototype.forEach.call(c.children, function (o) { panel.appendChild(item(o)); });
        } else panel.appendChild(item(c));
      });
      label();
    }
    btn.onclick = function (e) {
      e.stopPropagation();
      if (panel.hidden) {
        build(); var r = btn.getBoundingClientRect(); panel.style.top = (r.bottom + 8) + "px"; panel.style.maxHeight = (window.innerHeight - r.bottom - 90) + "px"; panel.hidden = false; btn.classList.add("open"); document.documentElement.classList.add("ddlock");
        var on = panel.querySelector(".on"); if (on) on.scrollIntoView({ block: "center" });
      } else close();
    };
    document.addEventListener("click", function (e) { if (!wrap.contains(e.target) && !panel.contains(e.target)) close(); }); window.addEventListener("resize", close);
    new MutationObserver(build).observe(sel, { childList: true, subtree: true });
    new MutationObserver(label).observe(sel, { attributes: true, attributeFilter: ["hidden"] });
    setInterval(label, 600);
    build();
  }
  function init() { enhance("leagueSel"); enhance("langSel"); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
