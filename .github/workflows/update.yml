name: update-space
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt huggingface_hub
      - name: Import football-data
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          cd backend
          python importer.py --source football-data --competition PL,ELC,BL1,SA,PD,FL1,DED,PPL,BSA,CL,EC,WC
      - name: Import Highlightly (Arabic, women's and youth leagues)
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          cd backend
          for L in 199067 262041 170984 256935 260339 38228 121626 55248 70566 119073 216938 595633 12698 758174 775194 630524 960712 598186; do
            python importer.py --source highlightly --hl-league $L --season 2026 || echo "::warning::league $L failed"
          done
      - name: Import national teams pools
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          cd backend
          python import_pools.py --active --reserve 10 || echo "::warning::pools failed"
      - name: Import Sii-Football (disability football)
        run: |
          cd backend
          python import_sii_football.py || echo "::warning::sii-football import failed"
      - name: Track predictions
        run: |
          cd backend
          python track.py || echo "::warning::tracking failed"
      - name: Build static
        run: |
          cd backend
          python build_static.py --standalone
      - name: Fetch press
        run: python backend/fetch_press.py || echo "::warning::press fetch failed"
      - name: Save static data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git status --short
          git add docs
          if [ -d backend/pooldata ]; then git add backend/pooldata; fi
          git diff --cached --quiet || (git commit -m "Update static data" && git pull --rebase --autostash && git push)
      - name: Upload
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python upload.py
